# Maravi - build, test and package for Linux x86_64 (2026-10-27).
#
# The release gate of the RASGO family: the package is built here, on
# Ubuntu 22.04 (glibc 2.35, so it also runs on Debian 12 and newer systems),
# never on the author's machine (glibc 2.39). The frozen binary transcribes a
# synthetic voice end to end, then starts in clean containers of five
# distributions. A `v*` tag publishes the release; the manual button only
# builds and tests. The repository is public: the CI costs nothing, and it
# never runs on ordinary pushes (routine validation is local).
name: Maravi — build, test & package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Existing run ID for a launch check without rebuilding packages
        type: string
        required: false

permissions:
  contents: read
  actions: read

env:
  MARAVI_NO_BROWSER: '1'

jobs:
  package:
    if: ${{ inputs.package_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg binutils poppler-utils imagemagick

      - name: Python dependencies (the pinned Linux set)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local-linux-py312.txt
          python -m pip install --no-deps basic-pitch==0.4.0
          python -m pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9
          python -c 'from basic_pitch import ONNX_PRESENT, ICASSP_2022_MODEL_PATH; assert ONNX_PRESENT and ICASSP_2022_MODEL_PATH.is_file()'

      - name: Tests
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py'
          for t in tests/*.cjs; do node "$t"; done

      - name: Build the frozen Linux application
        run: python -B packaging/build_linux.py

      - name: The frozen binary transcribes end to end
        run: |
          mkdir -p pkgs
          app=$(find .local-build -maxdepth 3 -type d -name 'Maravi-*-linux-x86_64' -path '*/dist/*' | head -1)
          timeout 600 python -B tools/smoke_frozen_server.py "$app/$(basename "$app")"
          cp "$app/THIRD_PARTY_NOTICES/ABI_REPORT.json" pkgs/
          echo "glibc required: $(python -c 'import json;print(json.load(open("pkgs/ABI_REPORT.json"))["highest_glibc_symbol"])')"

      - name: Build .deb, AppImage and installable .tar.gz
        run: |
          set -euo pipefail
          app=$(find .local-build -maxdepth 3 -type d -name 'Maravi-*-linux-x86_64' -path '*/dist/*' | head -1)
          mkdir -p .local-build/tooling pkgs
          curl --fail --location --connect-timeout 15 --max-time 90 --max-filesize 33554432 \
            -o .local-build/tooling/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  .local-build/tooling/linuxdeploy-x86_64.AppImage' | sha256sum -c -
          chmod +x .local-build/tooling/linuxdeploy-x86_64.AppImage
          (cd packaging/linux/appimage/runtime && sha256sum -c SHA256SUMS)
          timeout 900 python -B packaging/package_formats.py \
            --source "$app" --output pkgs \
            --linuxdeploy .local-build/tooling/linuxdeploy-x86_64.AppImage \
            --runtime packaging/linux/appimage/runtime/runtime-x86_64
          (cd pkgs && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: maravi-linux
          path: pkgs/
          retention-days: 14

  # the package must start on a clean system of each family (no Python, no
  # FFmpeg): the local page answers and the score page reports what is missing
  launch:
    needs: package
    if: ${{ !cancelled() && (needs.package.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.package_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:22.04', 'ubuntu:24.04', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maravi-linux
          path: pkgs
          github-token: ${{ inputs.package_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.package_run_id || github.run_id }}

      - name: Tools of the test (curl, tar, xz)
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar xz-utils dpkg ffmpeg
          elif command -v dnf >/dev/null; then dnf install -y curl tar xz ffmpeg-free
          elif command -v pacman >/dev/null; then pacman -Syu --noconfirm curl tar xz ffmpeg
          fi

      - name: Install the Debian package where supported
        run: |
          if command -v apt-get >/dev/null; then apt-get install -y ./pkgs/maravi-*-linux-x86_64.deb; fi

      - name: Checkout the startup check
        uses: actions/checkout@v4
        with:
          path: source

      - name: Start each Linux package and check the local page
        run: bash source/packaging/linux/testar-pacotes.sh pkgs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, launch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maravi-linux
          path: pkgs

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          glibc=$(python3 -c 'import json;print(json.load(open("pkgs/ABI_REPORT.json"))["highest_glibc_symbol"])')
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Maravi ${GITHUB_REF_NAME#v}" \
            --notes "Recorded melodies into readable scores, on your own computer. **Linux x86_64** (glibc ${glibc} or newer: Ubuntu 22.04+, Mint 21+, Debian 12+, Fedora, Arch). Requires FFmpeg; Audiveris, MuseScore, Poppler and ImageMagick only to read printed scores.

          **Install:** step by step in four languages in [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md). Debian or Ubuntu: install the Debian package. Other distributions: use the AppImage or the user-local tar.gz. FFmpeg is required for audio transcription.

          **Stated limitations:** no separation of instruments in a mix; every result needs human review in a score editor; Windows and macOS untested. Launch-tested in clean Debian 12, Ubuntu 22.04 and 24.04, Fedora and Arch containers.

          ---

          Gravações de melodias em partituras legíveis, no seu computador. **Linux x86_64**; requer FFmpeg. Passo a passo em português no [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md#português)." \
            pkgs/*.deb pkgs/*.AppImage pkgs/*.tar.gz pkgs/SHA256SUMS
